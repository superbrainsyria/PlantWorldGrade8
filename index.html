<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار صح أو خطأ – حياة النبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f5e9;--card:#fff;--tx:#1b3a20;--mu:#4d6b52;--pr:#2e9e4f;--pd:#1b6b34;--ok:#2e9e4f;--no:#d9442f;--bd:#c5e1c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f14;--card:#183024;--tx:#e8f5e9;--mu:#a5c7aa;--bd:#2c5239}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:20px;line-height:1.7;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:30px;font-weight:900;margin:8px 0;text-align:center}
.hero{text-align:center;font-size:64px;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(8deg) scale(1.08)}}
.sub{text-align:center;color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 6px 18px rgba(30,100,50,.12)}
.lbl{font-weight:900;font-size:22px;margin:0 0 10px}
.modes{display:grid;gap:10px}
.mode{font:inherit;font-size:21px;font-weight:700;text-align:right;color:var(--tx);background:var(--bg);border:3px solid var(--bd);border-radius:18px;padding:12px 16px;cursor:pointer;transition:.2s}
.mode small{display:block;font-weight:500;font-size:17px;color:var(--mu)}
.mode.on{border-color:var(--pr);background:var(--pr);color:#fff;transform:scale(1.02)}
.mode.on small{color:#e8f5e9}
input[type=range]{width:100%;height:40px;accent-color:var(--pr)}
.cnt{text-align:center;font-size:40px;font-weight:900;color:var(--pr)}
.btn{display:block;width:100%;font:inherit;font-size:24px;font-weight:900;color:#fff;background:var(--pr);border:0;border-radius:20px;padding:16px;cursor:pointer;box-shadow:0 5px 0 var(--pd);transition:.15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pd)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:18px}
.pill{background:var(--card);border:2px solid var(--bd);border-radius:999px;padding:2px 12px}
.bar{height:16px;background:var(--bd);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ed957,#2e9e4f);border-radius:99px;transition:width .5s}
.q{font-size:25px;font-weight:700;min-height:130px;display:flex;align-items:center}
.qn{color:var(--mu);font-size:17px;font-weight:700}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.ans button{font:inherit;font-size:28px;font-weight:900;color:#fff;border:0;border-radius:20px;padding:18px 6px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.ans button:active{transform:translateY(4px)}
.t{background:var(--ok)}.f{background:var(--no)}
.ans button:disabled{opacity:.45;cursor:default}
.fb{border-radius:18px;padding:14px;margin-top:12px;font-weight:700;display:none}
.fb.g{display:block;background:#d6f2dc;color:#14502a;border:2px solid var(--ok)}
.fb.b{display:block;background:#fde0db;color:#7a1f12;border:2px solid var(--no)}
.fb small{display:block;font-weight:500;font-size:17px;margin-top:4px}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.04);border-color:var(--ok)}}
.slide{animation:slide .4s}
@keyframes slide{from{opacity:0;transform:translateX(-40px)}}
.big{text-align:center;font-size:72px;margin:0}
.score{text-align:center;font-size:48px;font-weight:900;color:var(--pr);margin:0}
.msg{text-align:center;font-weight:700;font-size:23px}
.row{display:flex;gap:10px}
.sec{background:var(--card);color:var(--tx);border:2px solid var(--bd);box-shadow:none}
.mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;font-size:26px;background:var(--card);border:2px solid var(--bd);border-radius:50%;width:48px;height:48px;cursor:pointer;z-index:5}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
#fx span{position:absolute;top:-50px;font-size:30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.hide{display:none}
</style>
</head>
<body>
<button class="mute" id="mu" aria-label="الصوت">🔊</button>
<div id="fx"></div>
<div id="app">

<div id="s1">
 <div class="hero">🌱</div>
  <h2>مركز سوبر برين لانشطة الذكاء و تنمية و تسويق المهارات</h2>
  <h3>واتس 0994280934</h3>

 <h1>اختبار حياة النبات</h1>

  <input type="range" id="rg" min="10" max="40" value="20"></div>
 <button class="btn" id="go">ابدأ الاختبار 🚀</button>
</div>

<div id="s2" class="hide">
 <div class="top"><span class="pill" id="sc">✅ 0</span><span class="pill" id="er"></span></div>
 <div class="bar"><i id="pb"></i></div>
 <div class="card" id="qc">
  <div class="qn" id="qn"></div>
  <div class="q" id="qt"></div>
  <div class="ans"><button class="t" id="bt">صح ✔</button><button class="f" id="bf">خطأ ✘</button></div>
  <div class="fb" id="fb"></div>
 </div>
 <button class="btn hide" id="nx">التالي ◀</button>
</div>

<div id="s3" class="hide">
 <div class="card">
  <p class="big" id="rs"></p>
  <p class="score" id="rn"></p>
  <p class="msg" id="rm"></p>
  <p class="sub" id="rd"></p>
 </div>
 <div class="row"><button class="btn" id="again">أعد المحاولة</button><button class="btn sec" id="home">القائمة</button></div>
</div>
</div>

<script>

const M={easy:["🌿 سهل","يكمل معك حتى النهاية",null],mid:["🌱 متوسط","25% أخطاء ثم ينتهي الاختبار",.25],hard:["🔥 صعب","10% أخطاء ثم ينتهي الاختبار",.1],xh:["💎 صعب جداً","5% أخطاء ثم ينتهي الاختبار",.05]};
const $=i=>document.getElementById(i);
let mode="easy",cnt=20,L=[],i=0,ok=0,bad=0,allowed=Infinity,lock=false,mute=false,AC=null,over=false;
const lim=(p,n)=>p==null?Infinity:Math.floor(n*p+1e-9);

function drawModes(){
 $("modes").innerHTML="";
 for(const k in M){
  const a=lim(M[k][2],cnt),b=document.createElement("button");
  b.className="mode"+(k==mode?" on":"");
  const t=a==Infinity?"يكمل حتى النهاية ثم تظهر النتيجة":a==0?"لا يُسمح بأي خطأ، ينتهي عند أول غلطة":"يُسمح بـ "+a+(a<11?" أخطاء":" خطأً")+" ثم ينتهي الاختبار";
  b.innerHTML=M[k][0]+"<small>"+t+"</small>";
  b.onclick=()=>{mode=k;beep("tap");drawModes()};
  $("modes").appendChild(b);
 }
}
$("rg").oninput=e=>{cnt=+e.target.value;$("cn").textContent=cnt;drawModes()};
$("mu").onclick=()=>{mute=!mute;$("mu").textContent=mute?"🔇":"🔊"};

function tone(f,t,d,ty,v){
 if(mute)return;
 AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;
 o.type=ty||"sine";o.frequency.value=f;
 g.gain.setValueAtTime(v||.2,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
 o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d);
}
function beep(k){
 try{
  if(k=="tap")tone(520,0,.08);
  if(k=="ok"){tone(523,0,.15);tone(659,.12,.15);tone(784,.24,.3)}
  if(k=="no"){tone(220,0,.25,"sawtooth",.15);tone(150,.2,.4,"sawtooth",.15)}
  if(k=="win"){[523,659,784,1047,784,1047].forEach((f,j)=>tone(f,j*.14,.3))}
  if(k=="lose"){[392,330,262].forEach((f,j)=>tone(f,j*.25,.45,"triangle"))}
 }catch(e){}
}
function rain(arr,n){
 for(let j=0;j<n;j++){
  const s=document.createElement("span");
  s.textContent=arr[j%arr.length];
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=(1.8+Math.random()*1.8)+"s";
  s.style.animationDelay=Math.random()*.5+"s";
  $("fx").appendChild(s);setTimeout(()=>s.remove(),4200);
 }
}
function show(id){["s1","s2","s3"].forEach(x=>$(x).classList.toggle("hide",x!=id));window.scrollTo(0,0)}

function start(){
 L=Q.slice().sort(()=>Math.random()-.5).slice(0,cnt);
 i=0;ok=0;bad=0;over=false;allowed=lim(M[mode][2],cnt);
 show("s2");beep("tap");ask();
}
function hud(){
 $("sc").textContent="✅ "+ok+" من "+(ok+bad);
 $("er").textContent=allowed==Infinity?"❌ أخطاء: "+bad:"❤️ المتبقي: "+Math.max(allowed-bad+0,0)+" خطأ";
 $("pb").style.width=(i/cnt*100)+"%";
}
function ask(){
 lock=false;hud();
 const c=$("qc");c.classList.remove("slide","shake","pop");void c.offsetWidth;c.classList.add("slide");
 $("qn").textContent="السؤال "+(i+1)+" من "+cnt;
 $("qt").textContent=L[i][0];
 $("fb").className="fb";$("nx").classList.add("hide");
 $("bt").disabled=$("bf").disabled=false;
}
function pick(v){
 if(lock)return;lock=true;
 const q=L[i],right=(v==q[1]);
 $("bt").disabled=$("bf").disabled=true;
 const fb=$("fb");
 if(right){
  ok++;beep("ok");rain(["🍃","🌿","🍀","🌱"],14);$("qc").classList.add("pop");
  fb.className="fb g";fb.innerHTML="أحسنت! إجابة صحيحة 🎉<small>الجواب: "+(q[1]?"صح":"خطأ")+" – صفحة "+q[2]+"</small>";
 }else{
  bad++;beep("no");$("qc").classList.add("shake");
  if(navigator.vibrate)navigator.vibrate(200);
  fb.className="fb b";
  fb.innerHTML="إجابة خاطئة 😕<small>الجواب الصحيح: "+(q[1]?"صح":"خطأ")+(q[3]?" – التصحيح: "+q[3]:"")+" (صفحة "+q[2]+")</small>";
 }
 i++;
 over=bad>allowed;
 const last=i>=cnt||over;
 hud();
 $("nx").textContent=last?"عرض النتيجة 🏁":"التالي ◀";
 $("nx").classList.remove("hide");
 $("nx").dataset.last=last?1:0;
 setTimeout(()=>$("nx").scrollIntoView({behavior:"smooth",block:"nearest"}),150);
}
$("bt").onclick=()=>pick(1);$("bf").onclick=()=>pick(0);
$("nx").onclick=()=>{beep("tap");$("nx").dataset.last==1?finish():ask()};

function finish(){
 show("s3");
 const ans=ok+bad,pct=Math.round(ok/cnt*100);
 $("rn").textContent=ok+" / "+cnt;
 let em,m;
 if(over){em="😢";m="انتهى الاختبار لأنك تجاوزت عدد الأخطاء المسموح";beep("lose")}
 else if(pct>=90){em="🏆";m="ممتاز! أنت عبقري النبات";beep("win");rain(["🎉","⭐","🌟","🌿","🎊"],40)}
 else if(pct>=70){em="🌟";m="جيد جداً! استمر";beep("win");rain(["🎉","⭐","🍃"],25)}
 else if(pct>=50){em="🌱";m="جيد، راجع الدروس وحاول مجدداً";beep("ok")}
 else{em="📖";m="تحتاج مراجعة أكثر، لا تستسلم!";beep("lose")}
 $("rs").textContent=em;$("rm").textContent=m;
 $("rd").textContent="الإجابات الصحيحة: "+ok+" – الأخطاء: "+bad+" – المجاب عنها: "+ans+" من "+cnt+" ("+M[mode][0].slice(3)+")";
}
$("go").onclick=start;
$("again").onclick=start;
$("home").onclick=()=>{beep("tap");show("s1")};
drawModes();
</script>
